# Managed by chezmoi. Dimidium-inspired Starship prompt for wing.
# Goals: calm dark-terminal palette, obvious host/context, useful git state,
# and a compact two-line input area that stays readable over SSH/RDP.

format = """
$os$username$hostname$directory$git_branch$git_status$cmd_duration$line_break$character"""
right_format = "$status$time"
add_newline = true
palette = "dimidium"

[palettes.dimidium]
# Muted Dimidium-derived prompt accents for a clean, heavier look.
# Keep the dark background/foreground, but avoid bright ANSI colors in the prompt.
fg = "#BAB7B6"
bg = "#141414"
black = "#000000"
red = "#B65A5D"
green = "#78996A"
yellow = "#A9823B"
blue = "#5E7698"
magenta = "#806A86"
cyan = "#63888A"
white = "#BAB7B6"
bright_black = "#706C6C"
bright_red = "#CF7A65"
bright_green = "#86AD8B"
bright_yellow = "#B99B55"
bright_blue = "#7187A8"
bright_magenta = "#927891"
bright_cyan = "#789799"
bright_white = "#D3D0CE"

[os]
disabled = false
style = "bold cyan"
format = "[$symbol]($style) "

[os.symbols]
Debian = ""
Raspbian = ""
Ubuntu = ""
Linux = ""
Macos = ""
Windows = ""

[username]
show_always = false
style_user = "bright_black"
style_root = "bold red"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "bold cyan"
format = "[@$hostname]($style) "
trim_at = "."

[directory]
style = "bold blue"
read_only_style = "red"
truncation_length = 4
truncate_to_repo = false
fish_style_pwd_dir_length = 1
read_only = " 󰌾"
format = "[$path]($style)[$read_only]($read_only_style) "
home_symbol = "~"

[git_branch]
symbol = " "
style = "magenta"
format = "[$symbol$branch]($style) "

[git_status]
style = "yellow"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "=${count}"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "*${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[cmd_duration]
min_time = 1000
style = "bright_black"
format = "took [$duration]($style) "

[status]
disabled = false
style = "red"
symbol = "✗"
success_symbol = ""
format = "[$symbol$status]($style) "

[time]
disabled = false
style = "bright_black"
format = "[$time]($style)"
time_format = "%H:%M"

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](blue)"
